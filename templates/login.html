<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Smart Trolley</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="logo">
        <span><i class="bi bi-cart3"></i> Smart Trolley</span>
      </div>

      <h2>Welcome Back</h2>
      <p class="subtitle">Login to your account</p>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          <div class="flash-messages" style="position: static; margin-bottom: 20px; width: 100%;">
            {% for category, message in messages %}
              <div class="flash-msg flash-{{ 'danger' if category == 'error' else category }}">
                <span>{{ message }}</span>
                <button type="button" class="flash-close" onclick="this.parentElement.remove();">&times;</button>
              </div>
            {% endfor %}
          </div>
        {% endif %}
      {% endwith %}

      <form action="/login" method="POST" id="loginForm" novalidate>
        <div class="form-group">
          <label for="email">Email or Username</label>
          <input 
            type="text" 
            id="email" 
            name="email" 
            placeholder="Enter your email or admin username" 
            value="{{ email_value if email_value else '' }}"
            required 
            autocomplete="username"
          >
          <div class="field-error" id="email-error"><i class="bi bi-exclamation-circle"></i><span></span></div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="password-wrapper">
            <input 
              type="password" 
              id="password" 
              name="password" 
              placeholder="Enter your password" 
              required 
              autocomplete="current-password"
            >
            <button type="button" class="password-toggle-btn" id="togglePasswordBtn" title="Show or hide password" aria-label="Toggle password visibility">
              <i class="bi bi-eye" id="togglePasswordIcon"></i>
            </button>
          </div>
          <div class="field-error" id="password-error"><i class="bi bi-exclamation-circle"></i><span></span></div>
        </div>

        <div class="form-check">
          <input type="checkbox" id="is_admin" name="is_admin" value="1" {% if is_admin %}checked{% endif %}>
          <label for="is_admin">Login as Administrator</label>
        </div>

        <button type="submit" class="btn btn-primary btn-block">
          <i class="bi bi-box-arrow-in-right"></i>
          <span>Login</span>
        </button>
      </form>

      <div class="auth-links">
        Don't have an account? <a href="/register">Register here</a>
      </div>
    </div>
  </div>

  <script>
    // Password visibility toggle
    const togglePasswordBtn = document.getElementById('togglePasswordBtn');
    const passwordInput = document.getElementById('password');
    const togglePasswordIcon = document.getElementById('togglePasswordIcon');

    if (togglePasswordBtn && passwordInput && togglePasswordIcon) {
      togglePasswordBtn.addEventListener('click', function() {
        const isPassword = passwordInput.getAttribute('type') === 'password';
        passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
        togglePasswordIcon.className = isPassword ? 'bi bi-eye-slash' : 'bi bi-eye';
      });
    }

    // Client-side input validation
    const loginForm = document.getElementById('loginForm');
    const emailInput = document.getElementById('email');
    const emailError = document.getElementById('email-error');
    const passwordError = document.getElementById('password-error');

    function showError(input, errorEl, message) {
      input.classList.add('is-invalid');
      errorEl.querySelector('span').textContent = message;
      errorEl.classList.add('active');
    }

    function clearError(input, errorEl) {
      input.classList.remove('is-invalid');
      errorEl.querySelector('span').textContent = '';
      errorEl.classList.remove('active');
    }

    emailInput.addEventListener('input', () => {
      if (emailInput.value.trim()) clearError(emailInput, emailError);
    });

    passwordInput.addEventListener('input', () => {
      if (passwordInput.value) clearError(passwordInput, passwordError);
    });

    loginForm.addEventListener('submit', function(e) {
      let isValid = true;
      const isAdmin = document.getElementById('is_admin').checked;

      if (!emailInput.value.trim()) {
        showError(emailInput, emailError, isAdmin ? 'Please enter your admin username or email.' : 'Please enter your registered email address.');
        isValid = false;
      } else {
        clearError(emailInput, emailError);
      }

      if (!passwordInput.value) {
        showError(passwordInput, passwordError, 'Please enter your account password.');
        isValid = false;
      } else {
        clearError(passwordInput, passwordError);
      }

      if (!isValid) {
        e.preventDefault();
      }
    });
  </script>
</body>
</html>
